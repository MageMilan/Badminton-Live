name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # 👈 如果你的默认分支叫 master，请改成 master

# 设置 GitHub Token 的权限，允许它将打包后的文件写入 gh-pages 分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 打包生成的文件夹名称
          branch: gh-pages # 部署到 gh-pages 分支